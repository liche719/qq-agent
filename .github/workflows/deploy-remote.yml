name: Build and deploy remote agent

on:
  push:
    branches: [main]
    # 只改文档不触发构建与部署（镜像里没有这些文件）
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'AGENTS.md'
      - 'LICENSE'
      # 只改 CI 配置本身不该触发一次部署（2026-09-30 加）：否则改工作流/加诊断工作流
      # 都会白跑一次。注意副作用——改了这个文件要生效，得手动 workflow_dispatch 一次。
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: remote-agent-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 默认的 GITHUB_TOKEN 权限偏宽，而这个 job 只读代码、只往服务器推镜像与 compose：
    # 显式收到只读，万一某个 step 被注入也拿不到仓库写权限。
    permissions:
      contents: read
    steps:
      # 三个 action 全部钉到 commit SHA（注释里保留人类可读的版本号）：
      # 浮动 tag 被上游移动/接管时，会在**持有服务器部署私钥的 runner** 上执行任意代码 ——
      # 那把私钥等于生产 root，所以这里不接受"跟随最新 tag"。
      # 升级时手动改 SHA，并顺手确认版本号注释。
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e   # v3

      - name: Build image (with layer cache)
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9   # v6
        with:
          context: .
          load: true
          tags: wechat-agent:${{ github.sha }}
          # 复用上一次构建的层（前端 npm 依赖、Maven 依赖、基础镜像），显著缩短部署时间
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        run: docker save wechat-agent:${GITHUB_SHA} | gzip > wechat-agent-${GITHUB_SHA}.tar.gz

      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # 固定主机指纹，**不再用 ssh-keyscan**：keyscan 是"第一次见到就信任"（TOFU），
          # 在途攻击者可以在首次部署时冒充部署目标，把镜像与 compose 推给伪造主机、
          # 顺手收走我们发过去的口令。指纹值取自服务器自己的 /etc/ssh/ssh_host_ed25519_key.pub。
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_HOST_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # 显式要求严格校验主机指纹：默认的 ask 在非交互 shell 里会变成"提示并卡住"，
          # yes 则是"不匹配就直接失败"—— 这正是我们要的（宁可部署红，也不要静默连到伪造主机）。
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # 服务器上那把部署私钥带 restrict + command="/usr/local/bin/wechat-deploy"：
      # 它只能跑那个脚本、拿不到 shell，所以 scp 用不了 —— 三个文件改成「走 stdin 交给 wechat-deploy 的子命令」。
      # 每次上传都要带 HMAC-SHA256（密钥是本仓库的 DEPLOY_TAR_SECRET，服务端在 /etc/wechat-deploy.secret），
      # 服务端验签通过才落盘：**光拿到部署私钥推不进任何内容**。详见 `deploy/server/wechat-deploy` 顶部说明。
      - name: Upload image and deployment files
        env:
          DEPLOY_TAR_SECRET: ${{ secrets.DEPLOY_TAR_SECRET }}
        run: |
          set -eu
          HOST="${{ secrets.DEPLOY_HOST }}"
          DUSER="${{ secrets.DEPLOY_USER }}"
          # 密钥两端都可能带一个尾部换行（gh secret set 的写入习惯），统一去掉再算，避免"本地算得出、CI 算不出"
          SECRET=$(printf '%s' "$DEPLOY_TAR_SECRET" | tr -d '\r\n')
          mac() { printf '%s' "$1" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $NF}'; }

          image_sha=$(sha256sum wechat-agent-${GITHUB_SHA}.tar.gz | cut -d' ' -f1)
          ssh -i ~/.ssh/deploy_key "$DUSER@$HOST" \
            "wechat-deploy upload-image ${GITHUB_SHA} ${image_sha} $(mac "$image_sha")" < wechat-agent-${GITHUB_SHA}.tar.gz

          compose_sha=$(sha256sum docker-compose.remote.yml | cut -d' ' -f1)
          ssh -i ~/.ssh/deploy_key "$DUSER@$HOST" \
            "wechat-deploy upload-compose ${compose_sha} $(mac "$compose_sha")" < docker-compose.remote.yml

          settings_sha=$(sha256sum docker/searxng/settings.yml | cut -d' ' -f1)
          ssh -i ~/.ssh/deploy_key "$DUSER@$HOST" \
            "wechat-deploy upload-settings ${settings_sha} $(mac "$settings_sha")" < docker/searxng/settings.yml

      - name: Load image and update only Java service
        run: |
          # 远端动作全部收敛到服务器上的 /usr/local/bin/wechat-deploy：load 镜像、只重建 agent、
          # 重启 searxng（settings.yml 是挂载进去的、不热加载）、按 image id 保留两代镜像 tag、删掉镜像包、
          # 打印容器与镜像状态。**远端逻辑要改就改那个脚本**（仓库里留了一份 `deploy/server/wechat-deploy`），
          # 不要再往 CI 里塞 shell —— 这里的私钥已经没有执行任意命令的权限了。
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "wechat-deploy deploy ${GITHUB_SHA}"

      # 部署后自检：面板能打开、鉴权生效、登录接口正常；失败会推一条 QQ 告警并让流水线红掉
      - name: Smoke check deployed panel
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          NAME="liche.cloud"
          BASE="https://$HOST"
          KEY="${{ secrets.ADMIN_API_KEY }}"
          # 不带口令的检查走 **IP 直连 + -k**：证书是给 liche.cloud 签的，IP 访问必然名称不匹配，
          # 这里没有凭据、被中间人也拿不到东西。**不要用 `--resolve liche.cloud:443:<IP>`**——
          # ICP 备案期间 A 记录是 DISABLED，阿里云按 SNI 拦未备案域名，带 liche.cloud SNI 的连接会被
          # 直接掐断（实测外部 `--resolve` 000、直连 IP 200），那样自检会恒红。
          code() { curl -sk -o /dev/null -w '%{http_code}' --retry 3 --retry-connrefused --retry-delay 2 --max-time 25 "$@"; }
          problems=""
          check() { if [ "$2" != "$3" ]; then problems="$problems $1(期望$2得到$3)"; fi; }

          # 应用冷启动实测 35~40 秒（JPA + Quartz + TLS），容器重建后还要等 compose 起来；
          # 窗口给足 4 分钟，避免"还在启动"被当成部署失败（已经误报过一次）。
          ready=0
          for i in $(seq 1 48); do
            if [ "$(code "$BASE/index.html")" = "200" ]; then ready=1; echo "应用已就绪（第 $i 次探测）"; break; fi
            echo "等待应用就绪 ($i)…"
            sleep 5
          done
          [ "$ready" = "1" ] || echo "❌ 等了 4 分钟应用仍未就绪"

          asset=$(curl -sk --max-time 25 "$BASE/index.html" | grep -oE '/assets/[A-Za-z0-9._-]+\.js' | head -1)
          check "首页" 200 "$(code "$BASE/")"
          check "前端资源${asset:-（缺失）}" 200 "$(code "$BASE${asset}")"
          check "无口令应被拒" 401 "$(code "$BASE/api/admin/overview")"
          # 百分号编码变体也必须被拦住（历史上 /api/adm%69n/overview 能绕过口令）
          check "编码路径也应被拒" 401 "$(code "$BASE/api/adm%69n/overview")"

          # 带口令的检查放到**服务器本机**跑（127.0.0.1）：流量不出主机，
          # 所以既可以用 -k（IP 访问没有匹配证书），又不存在"明文口令经不校验证书的公网连接"的问题。
          # 这句同样走受限的 wechat-deploy（smoke-admin），口令从 **stdin** 进：不进命令行、不进日志。
          remote=$(printf 'KEY=%s\n' "$KEY" | \
            ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@$HOST" "wechat-deploy smoke-admin")
          echo "服务端本机自检：$remote"
          check "带口令接口" 200 "$(echo "$remote" | sed -n 's/.*withkey=\([0-9]*\).*/\1/p')"
          check "账号密码登录" 200 "$(echo "$remote" | sed -n 's/.*login=\([0-9]*\).*/\1/p')"

          # 域名这一组只在真的解析到本机时才校验（备案通过后自动生效）：那时才走真实证书链
          if [ "$(getent hosts "$NAME" | awk '{print $1}' | head -1)" = "$HOST" ]; then
            check "域名首页（证书校验）" 200 "$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "https://$NAME/")"
            check "域名带口令接口（证书校验）" 200 "$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
              -H "X-Agent-Admin-Key: $KEY" "https://$NAME/api/admin/overview")"
            domain_note="、域名证书校验通过"
          else
            domain_note="（域名校验已跳过：ICP 备案期间 A 记录为 DISABLED，面板暂用 https://$HOST/ 访问；备案通过后自动生效）"
            echo "ℹ️$domain_note"
          fi

          if [ -n "$problems" ]; then
            echo "❌ 部署后自检失败:$problems"
            # 告警也走服务器本机（口令与文案都从 stdin 进，不进命令行、不进日志）
            printf 'KEY=%s\nMSG=%s\n' "$KEY" "部署后自检失败：$problems" | \
              ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@$HOST" "wechat-deploy alert-notify" || true
            exit 1
          fi
          echo "✅ 部署后自检通过：页面可访问、鉴权生效（含编码路径）、登录与面板接口正常$domain_note"
