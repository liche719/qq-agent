# 运维面板的公网入口（远程部署专用）
# 职责：TLS 终止 + 请求限流 + 只放行前端入口/静态资源/面板接口。
# 上游 agent 仍只监听服务器回环 127.0.0.1:8080，本容器用 host 网络转发过去。
# 鉴权在应用层（登录页拿到的口令随请求头 X-Agent-Admin-Key 发给后端校验）。
# 证书由服务器侧生成、不入库：/opt/wechat-agent-infra/docker/gateway/certs/{server.crt,server.key}
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # 面板正常轮询约 0.5 请求/秒（默认 10 秒一轮），这里给 5 请求/秒、突发 20，
    # 既不影响使用，又能把脚本化爆破挡在 429。
    limit_req_zone $binary_remote_addr zone=panel:10m rate=5r/s;
    limit_req_status 429;

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:5m;
        ssl_session_timeout 10m;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        limit_req zone=panel burst=20 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        # 前端是单页应用（hash 路由），只需要放行入口、构建产物与面板接口。
        location = /              { proxy_pass http://127.0.0.1:8080/index.html; }
        location = /index.html    { proxy_pass http://127.0.0.1:8080/index.html; }
        location /assets/         { proxy_pass http://127.0.0.1:8080; }
        location /api/admin/      { proxy_pass http://127.0.0.1:8080; }
        location /                { return 404; }
    }
}
