# 运维面板的公网入口（远程部署专用）
# 职责：TLS 终止 + 账号密码（Basic Auth）+ 请求限流 + 只放行面板需要的路径。
# 上游 agent 仍只监听服务器回环 127.0.0.1:8080，本容器用 host 网络转发过去。
# 证书与凭据由服务器侧生成，挂载进容器，不入库：
#   /opt/wechat-agent-infra/docker/gateway/certs/{server.crt,server.key}
#   /opt/wechat-agent-infra/docker/gateway/auth/htpasswd
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # 面板正常轮询约 0.5 请求/秒（默认 10 秒一轮），这里给 5 请求/秒、突发 20，
    # 既不影响使用，又能把脚本化爆破挡在 429。
    limit_req_zone $binary_remote_addr zone=panel:10m rate=5r/s;
    limit_req_status 429;

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:5m;
        ssl_session_timeout 10m;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # 鉴权由应用自己完成（口令经 X-Agent-Admin-Key 头校验，失败 5 次按来源 IP 封禁 10 分钟），
        # 这里不再用 Basic Auth，登录页才能做成页面而不是浏览器弹窗。
        limit_req zone=panel burst=20 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        # 只暴露登录页、面板页与面板接口，其余一律 404（面板不需要的路径不对外）
        location = /          { return 302 /login.html; }
        location = /login.html { proxy_pass http://127.0.0.1:8080/login.html; }
        location = /login.js   { proxy_pass http://127.0.0.1:8080/login.js; }
        location = /admin.html { proxy_pass http://127.0.0.1:8080/admin.html; }
        location = /admin.js   { proxy_pass http://127.0.0.1:8080/admin.js; }
        location /api/admin/   { proxy_pass http://127.0.0.1:8080; }
        location /             { return 404; }
    }
}
