<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大运维监控面板</title><style>
:root{--bg:#0b1220;--panel:#121d30;--line:#243550;--ink:#e5edf8;--muted:#91a3bd;--ok:#36d399;--bad:#fb7185;--warn:#fbbf24;--accent:#60a5fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#182b4a,var(--bg) 45%);color:var(--ink);font:14px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1400px;margin:auto;padding:28px 22px 60px}header{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{margin:0;font-size:28px}h2{font-size:17px;margin:0}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,select,button{height:36px;border:1px solid var(--line);border-radius:9px;background:#0e192b;color:var(--ink);padding:0 12px}button{cursor:pointer}button:hover{border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}.card{background:rgba(18,29,48,.9);border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0}.value{font-size:25px;font-weight:700;margin-top:8px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:14px}.wide{grid-column:1/-1}.alerts{margin-top:14px}.alert{border:1px solid #713344;background:#2c1625;color:#fecdd3;padding:11px;border-radius:9px;margin-top:7px}.tabs{display:flex;gap:7px;margin:20px 0 10px;overflow:auto}.tab.active{background:#214a7c;border-color:#60a5fa}.section{display:none}.section.active{display:block}.table-wrap{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}.mono{font:12px ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}.chart{height:180px;display:flex;align-items:end;gap:3px;padding:15px 4px 4px;border-top:1px solid var(--line)}.bar{flex:1;min-width:2px;background:linear-gradient(#60a5fa,#2563eb);border-radius:3px 3px 0 0}.small{font-size:12px}.stale{color:var(--warn)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}main{padding:20px 12px}}
</style></head><body><main><header><div><h1>大运维监控面板</h1><div class="muted">本机管理 · 运行状态、业务指标与故障排查</div></div><div class="toolbar"><select id="interval"><option value="5000">5 秒</option><option value="10000" selected>10 秒</option><option value="30000">30 秒</option><option value="60000">60 秒</option><option value="0">暂停</option></select><button id="refresh">立即刷新</button><a href="/" style="color:#93c5fd">返回微信管理</a></div></header><div id="status" class="muted" style="margin-top:10px">等待加载…</div><div id="alerts" class="alerts"></div>
<div class="grid"><div class="card"><div class="muted">应用</div><div id="app" class="value">—</div></div><div class="card"><div class="muted">QQ 网关</div><div id="qq" class="value">—</div></div><div class="card"><div class="muted">用户</div><div id="users" class="value">—</div></div><div class="card"><div class="muted">UNKNOWN_RESULT</div><div id="unknown" class="value warn">—</div></div></div>
<div class="tabs"><button class="tab active" data-tab="overview">总览</button><button class="tab" data-tab="qqtab">QQ 监控</button><button class="tab" data-tab="tasks">任务</button><button class="tab" data-tab="usersTab">用户与记忆</button><button class="tab" data-tab="logs">日志</button></div>
<section id="overview" class="section active"><div id="overviewCards" class="grid"></div><div class="layout"><div class="card"><h2>完整状态</h2><pre id="overviewJson" class="mono"></pre></div><div class="card"><h2>最近指标趋势</h2><div id="chart" class="chart"></div><div class="small muted">服务端内存环形缓冲，重启后重新采样</div></div></div></section>
<section id="qqtab" class="section"><div class="card"><h2>QQ 通道指标</h2><pre id="qqJson" class="mono"></pre><button id="reconnect">触发 QQ 重连</button><button id="cleanup">清理过期缓存</button></div></section>
<section id="tasks" class="section"><div class="card"><h2>任务列表</h2><div class="toolbar" style="margin-top:10px"><select id="taskStatus"><option value="">全部状态</option><option>RUNNING</option><option>FAILED</option><option>UNKNOWN_RESULT</option><option>REPLY_SENT</option></select><input id="taskType" placeholder="任务类型"><input id="taskFailure" placeholder="失败原因"><button id="taskLoad">加载</button></div><div id="taskTable" class="table-wrap"></div></div></section>
<section id="usersTab" class="section"><div class="card"><h2>用户与记忆</h2><div id="userTable" class="table-wrap"></div><div id="userDetailTitle" class="muted" style="margin-top:18px"></div><div id="userDetailPager" class="toolbar" style="margin-top:8px"></div><pre id="userDetail" class="mono"></pre></div></section>
<section id="logs" class="section"><div class="card"><h2>近期操作日志</h2><div class="toolbar" style="margin-top:10px"><select id="logLevel"><option value="">全部级别</option><option>INFO</option><option>WARN</option><option>ERROR</option></select><input id="logQuery" placeholder="关键词过滤"><button id="logLoad">加载日志</button></div><div id="logTable" class="table-wrap"></div></div></section>
</main><script src="/admin.js" defer></script></body></html>
