server:
  port: ${SERVER_PORT:8080}
  # 本机部署默认不向局域网或公网暴露管理页面和内部 API。
  # 如确有反向代理部署需求，必须显式设置 SERVER_ADDRESS 并启用 production profile。
  address: ${SERVER_ADDRESS:127.0.0.1}

app:
  time-zone: ${APP_TIME_ZONE:Asia/Shanghai}

scheduler:
  task-pool-size: ${SCHEDULER_TASK_POOL_SIZE:2}
  thread-name-prefix: ${SCHEDULER_THREAD_NAME_PREFIX:scheduled-task-}

spring:
  application:
    name: wechat-agent
  profiles:
    default: local
  # 引入项目根目录的 .env 文件（optional: 表示文件不存在也不报错）
  config:
    import: optional:file:.env[.properties]
  datasource:
    # 2026-09-17：url/driver 参数化，**默认值仍是 MySQL（行为不变）**；
    # 迁 pg 时只改 env（DB_URL/DB_USER/DB_PASSWORD/DB_DRIVER），回滚也是改回来
    url: ${DB_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:wechat_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=${APP_TIME_ZONE:Asia/Shanghai}&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:${MYSQL_USER:}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:8}
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIME_ZONE:Asia/Shanghai}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:3s}
      # 只用 StringRedisTemplate，不用 Spring Data Redis 仓库；
      # 关掉可以避免启动时对 JPA 仓库报 "Could not safely identify store assignment"。
      repositories:
        enabled: false
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: true
    properties:
      org.quartz.scheduler.instanceName: WechatAgentScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.driverDelegateClass: ${QUARTZ_DELEGATE:org.quartz.impl.jdbcjobstore.StdJDBCDelegate}
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: false
      org.quartz.threadPool.threadCount: ${QUARTZ_THREAD_COUNT:4}
  jackson:
    time-zone: ${APP_TIME_ZONE:Asia/Shanghai}

llm:
  base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
  model: ${LLM_MODEL:deepseek-flash}
  api-key: ${LLM_API_KEY:}
  # 花销单价（元/百万 token）——**按 cache 命中分开**：官方 Flash 的命中价是未命中的 1/50，
  # 而我们的作业每轮都带同样的系统提示词，命中率很高，只按未命中算会把成本高估好几倍。
  # 峰谷：官方峰时价是谷时 2 倍（UTC 01–04、06–10，周一至周五；北京时间 09–12、14–18）。
  # 改价签参考 https://api-docs.deepseek.com/quick_start/pricing
  price:
    cache-hit-per-million: ${LLM_PRICE_CACHE_HIT_PER_MILLION:0.02}
    cache-miss-per-million: ${LLM_PRICE_CACHE_MISS_PER_MILLION:1.0}
    output-per-million: ${LLM_PRICE_OUTPUT_PER_MILLION:4.0}
    # 峰时倍率与时段（UTC，形如 `1-4,6-10`）。**时段留空 = 没有峰谷价**——
    # 换厂商/换模型只改这几行，代码不用动（这是 2026-09-15 计费解耦的落点之一）。
    peak-multiplier: ${LLM_PRICE_PEAK_MULTIPLIER:2.0}
    peak-windows-utc: ${LLM_PRICE_PEAK_WINDOWS_UTC:1-4,6-10}
  temperature: ${LLM_TEMPERATURE:0.7}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
  connect-timeout-seconds: ${LLM_CONNECT_TIMEOUT_SECONDS:5}
  # 深度思考**不再按场景开关**（2026-09-14 按用户要求整块删除：全部场景都用模型默认的思考）。
  # 原实现与实测数据保留在 docs/llm-call-modes.md（结论：这个模型默认就在思考，唯一有效的关闭方式是
  # thinking:{"type":"disabled"}；只有对话省电档能省到用户的等待时间，其余场景省的只是后台 token）。
  # 场景见 LlmScenario：dialog / dialog_deep / extract / reflect / reminder_parse / schedule_parse
  # 这些场景用温度 0（只要结构化输出正确，不需要发散）；留空 = 用内置默认值
  # （extract,reflect,reminder_parse,schedule_parse）
  zero-temperature-scenarios: ${LLM_ZERO_TEMPERATURE_SCENARIOS:extract,reflect,reminder_parse,schedule_parse}
  # 每个场景的**思考档位**（请求体的 reasoning_effort，取值 low/medium/high；没配的场景不传、用上游默认）。
  # 2026-09-18 用户要求：对话 / 提醒解析 / 定时任务解析 / 反思 都 low，只有**记忆提取 high**（质量优先、后台跑）。
  # 实测：low → 思考 984 token、4.8 秒；不传 → 3004、14.0 秒；high → 2368、11.2 秒。
  # 注意 low 只是"少想一点"，不是硬上限（"每三天提醒我浇花"这种要算日期的，low 下仍会想 3300 token）。
  reasoning-effort: ${LLM_REASONING_EFFORT:dialog=low,dialog_deep=low,extract=high,reminder_parse=low,schedule_parse=low,reflect=low}
  # 每个场景的 max_tokens 上限（0 = 不设，保持上游默认）。**思考 token 也算进这个上限**，所以结构化场景
  # 给的是宽松兜底（防极端长思考），对话档默认不设以免截断正常长回复。
  # reflect 单独一档：输出只有一句结论、但思考很重——实测 4096 会被思考吃满、正文为空（整条反思作废）。
  # structured 2026-09-18 也从 4096 提到 16384：提取窗口变大之后（15 轮 ≈ 2000+ 字），
  # 实测一次思考就吃掉 3577 token，4096 会把正文挤没 → JSON 解析失败 → 这一趟白跑还不报错。
  # 上限只是"最多允许多少"，不按上限计费，放宽没有额外成本。
  max-tokens:
    structured: ${LLM_MAX_TOKENS_STRUCTURED:16384}
    reflect: ${LLM_MAX_TOKENS_REFLECT:16384}
    dialog: ${LLM_MAX_TOKENS_DIALOG:0}
    dialog-deep: ${LLM_MAX_TOKENS_DIALOG_DEEP:0}

agent:
  message-batch-thread-name-prefix: ${AGENT_MESSAGE_BATCH_THREAD_NAME_PREFIX:message-batch-}
  workers: ${AGENT_WORKERS:8}
  queue-capacity: ${AGENT_QUEUE_CAPACITY:200}
  global-queue-capacity: ${AGENT_GLOBAL_QUEUE_CAPACITY:400}
  user-queue-idle-minutes: ${AGENT_USER_QUEUE_IDLE_MINUTES:30}
  message-batch-window-millis: ${AGENT_MESSAGE_BATCH_WINDOW_MILLIS:1500}
  message-batch-max-window-millis: ${AGENT_MESSAGE_BATCH_MAX_WINDOW_MILLIS:4000}
  # 仅在媒体消息后极短时间内、且命中可配置的补充关系规则时合并纯文本；普通新问题不会继承旧媒体。
  message-batch-continuation-window-millis: ${AGENT_MESSAGE_BATCH_CONTINUATION_WINDOW_MILLIS:900}
  message-batch-continuation-pattern: '${AGENT_MESSAGE_BATCH_CONTINUATION_PATTERN:}'
  tool-retry-attempts: ${AGENT_TOOL_RETRY_ATTEMPTS:1}
  tool-retry-delay-ms: ${AGENT_TOOL_RETRY_DELAY_MS:0}
  tool-max-result-chars: ${AGENT_TOOL_MAX_RESULT_CHARS:8000}
  max-tool-rounds: ${AGENT_MAX_TOOL_ROUNDS:8}
  # thinkDeeper 升档后放宽的预算：更多工具轮 + 更长的流式超时（复杂任务不至于半路 fallback）
  deep-tool-rounds: ${AGENT_DEEP_TOOL_ROUNDS:16}
  deep-stream-timeout-seconds: ${AGENT_DEEP_STREAM_TIMEOUT_SECONDS:240}
  # thinkDeeper 的按用户日额度：0 = 不限（只观测）
  thinking-daily-limit-per-user: ${THINKING_DAILY_LIMIT_PER_USER:5}
  # 按用户状态裁剪工具集：没有备考计划、近期也没聊考研的用户不下发 18 个考试工具 schema
  # （saveExamPlan / viewExamPlan 永远保留，否则新用户建不出计划）
  tool-trim:
    enabled: ${AGENT_TOOL_TRIM_ENABLED:true}
    history-turns: ${AGENT_TOOL_TRIM_HISTORY_TURNS:4}
  # 工具失败详情（"⚠️ 工具调用未完成：…"）要不要拼进给用户的回复。
  # 默认 false：只打 WARN 日志——模型在正文里本来就会自然说明失败，程序再追加内部状态既重复又难看
  tool-failure-notice:
    enabled: ${AGENT_TOOL_FAILURE_NOTICE_ENABLED:false}
  stream-timeout-seconds: ${AGENT_STREAM_TIMEOUT_SECONDS:120}
  image-max-redirects: ${AGENT_IMAGE_MAX_REDIRECTS:3}
  image-connect-timeout-seconds: ${AGENT_IMAGE_CONNECT_TIMEOUT_SECONDS:8}
  image-read-timeout-seconds: ${AGENT_IMAGE_READ_TIMEOUT_SECONDS:20}
  stream-chunk-chars: ${AGENT_STREAM_CHUNK_CHARS:24}
  stream-chunk-delay-ms: ${AGENT_STREAM_CHUNK_DELAY_MS:120}
  # 工具执行期间不额外发送气泡，避免 QQ 把进度和最终答案拆成多条消息。
  tool-progress-enabled: ${AGENT_TOOL_PROGRESS_ENABLED:false}
  message-idempotency-ttl-hours: ${AGENT_MESSAGE_IDEMPOTENCY_TTL_HOURS:24}
  policy:
    # 可按部署语言覆盖；留空或非法表达式时回退到内置安全规则。
    current-time-pattern: '${AGENT_CURRENT_TIME_PATTERN:(?s).*?(?:现在(?:是)?几点|当前(?:是)?几点|(?:现在|当前)(?:的)?时间|今天(?:是)?(?:几号|星期几|周几|日期)).*}'
    default-persona: '${AGENT_DEFAULT_PERSONA:你是用户的专属长期智能助手，说话自然口语化，像真人一样沟通，拒绝生硬机械的机器人话术。你会自动记住用户的重要信息和目标，帮用户设置提醒、搜索资料。用户可以随时用 /set-prompt 指令重新设定你的身份和性格。}'
    max-persona-chars: ${AGENT_MAX_PERSONA_CHARS:2000}
    tool-display-names:
      searchWeb: 搜索
      searchLatestWeb: 搜索
      searchVerifiedWeb: 核验搜索
      readWebPage: 读取网页
      getCurrentTime: 获取时间
      parseReminder: 创建提醒
      replaceReminder: 调整提醒
      cancelReminder: 取消提醒
      listReminders: 查看提醒
      getReminderStatus: 查询提醒状态
      saveImportantMedia: 保存文件
      inspectRecentUnstoredMedia: 查看刚才的媒体
      listStoredMedia: 查找已保存文件
      readStoredMedia: 读取已保存文件
      inspectStoredMedia: 审阅文件
      deleteStoredMedia: 删除文件
      findDownloadableLinks: 查找下载文件
      downloadWebFile: 下载文件
      sendDownloadedFile: 发送文件

searxng:
  base-url: ${SEARXNG_BASE_URL:http://localhost:8888}
  language: ${SEARXNG_LANGUAGE:zh-CN}
  timeout-seconds: ${SEARXNG_TIMEOUT_SECONDS:15}
  connect-timeout-seconds: ${SEARXNG_CONNECT_TIMEOUT_SECONDS:5}
  max-results: ${SEARXNG_MAX_RESULTS:10}
  # 搜索结果里排名靠前的若干条会额外抓取网页正文，回答才算"读过原文"而不是只看摘要
  deep-read-count: ${SEARXNG_DEEP_READ_COUNT:3}
  deep-read-chars: ${SEARXNG_DEEP_READ_CHARS:1200}

document:
  max-file-bytes: ${DOCUMENT_MAX_FILE_BYTES:20971520}
  max-text-chars: ${DOCUMENT_MAX_TEXT_CHARS:60000}
  max-pdf-pages: ${DOCUMENT_MAX_PDF_PAGES:10}
  max-redirects: ${DOCUMENT_MAX_REDIRECTS:3}
  connect-timeout-seconds: ${DOCUMENT_CONNECT_TIMEOUT_SECONDS:8}
  read-timeout-seconds: ${DOCUMENT_READ_TIMEOUT_SECONDS:30}
  user-agent: '${DOCUMENT_USER_AGENT:Mozilla/5.0 (compatible; WechatAgent/1.0)}'

media:
  context:
    pending-ttl-minutes: ${MEDIA_CONTEXT_PENDING_TTL_MINUTES:30}
    max-pending-per-conversation: ${MEDIA_CONTEXT_MAX_PENDING_PER_CONVERSATION:8}
    excerpt-max-chars: ${MEDIA_CONTEXT_EXCERPT_MAX_CHARS:4000}
    # 一次任务最多读几个已保存文件给模型（图片也算文件，按 mediaId 去重；超出直接拒绝，防止上下文被原图/正文撑爆）
    max-files-per-task: ${MEDIA_CONTEXT_MAX_FILES_PER_TASK:10}
  storage:
    root: ${MEDIA_STORAGE_ROOT:stored-media}
    max-file-bytes: ${MEDIA_STORAGE_MAX_FILE_BYTES:20971520}
    inspection-token-minutes: ${MEDIA_INSPECTION_TOKEN_MINUTES:5}
    max-redirects: ${MEDIA_STORAGE_MAX_REDIRECTS:3}
    connect-timeout-seconds: ${MEDIA_STORAGE_CONNECT_TIMEOUT_SECONDS:8}
    read-timeout-seconds: ${MEDIA_STORAGE_READ_TIMEOUT_SECONDS:30}
    max-list-results: ${MEDIA_STORAGE_MAX_LIST_RESULTS:20}
    inspection-max-text-chars: ${MEDIA_STORAGE_INSPECTION_MAX_TEXT_CHARS:4000}
    user-agent: '${MEDIA_STORAGE_USER_AGENT:Mozilla/5.0 (compatible; WechatAgent/1.0)}'

web:
  max-response-bytes: ${WEB_MAX_RESPONSE_BYTES:2097152}
  max-text-chars: ${WEB_MAX_TEXT_CHARS:12000}
  max-redirects: ${WEB_MAX_REDIRECTS:3}
  max-links: ${WEB_MAX_LINKS:20}
  connect-timeout-seconds: ${WEB_CONNECT_TIMEOUT_SECONDS:8}
  read-timeout-seconds: ${WEB_READ_TIMEOUT_SECONDS:20}
  user-agent: '${WEB_USER_AGENT:Mozilla/5.0 (compatible; WechatAgent/1.0)}'

qq:
  # QQ 官方机器人（需先在 QQ 开放平台创建机器人并获取 AppID/AppSecret）
  enabled: ${QQ_ENABLED:false}
  app-id: ${QQ_APP_ID:}
  client-secret: ${QQ_CLIENT_SECRET:}
  # 默认 false（连正式环境）：只有**显式**配了 QQ_SANDBOX=true 才走沙箱。
  # 原来默认 true，任何漏透传 QQ_SANDBOX 的部署都会静默连沙箱网关（普通用户的消息永远收不到，
  # 额度/行为也与生产不一致）。生产 compose 里显式传 QQ_SANDBOX，以那份值为准。
  sandbox: ${QQ_SANDBOX:false}
  group-enabled: ${QQ_GROUP_ENABLED:false}
  api-connect-timeout-seconds: ${QQ_API_CONNECT_TIMEOUT_SECONDS:5}
  api-read-timeout-seconds: ${QQ_API_READ_TIMEOUT_SECONDS:15}
  websocket-connect-timeout-seconds: ${QQ_WEBSOCKET_CONNECT_TIMEOUT_SECONDS:10}
  passive-window-ms: ${QQ_PASSIVE_WINDOW_MS:3600000}
  typing-keepalive-ms: ${QQ_TYPING_KEEPALIVE_MS:50000}
  ephemeral-cache-ttl-ms: ${QQ_EPHEMERAL_CACHE_TTL_MS:1800000}
  stream-state-ttl-ms: ${QQ_STREAM_STATE_TTL_MS:600000}
  max-conversation-cache-entries: ${QQ_MAX_CONVERSATION_CACHE_ENTRIES:2048}
  max-message-cache-entries: ${QQ_MAX_MESSAGE_CACHE_ENTRIES:4096}
  user-agent: '${QQ_USER_AGENT:qqbot-nodejs/1.0.4}'
  reconnect-backoff-ms: ${QQ_RECONNECT_BACKOFF_MS:2000,5000,10000,30000}
  reconnect-delay-ms: ${QQ_RECONNECT_DELAY_MS:2000}
  token-default-expire-seconds: ${QQ_TOKEN_DEFAULT_EXPIRE_SECONDS:7200}
  token-refresh-lead-ms: ${QQ_TOKEN_REFRESH_LEAD_MS:60000}
  default-heartbeat-ms: ${QQ_DEFAULT_HEARTBEAT_MS:45000}
  input-notify-seconds: ${QQ_INPUT_NOTIFY_SECONDS:60}
  max-message-chars: ${QQ_MAX_MESSAGE_CHARS:4000}
  markdown-max-chars: ${QQ_MARKDOWN_MAX_CHARS:4000}
  command-panel-enabled: ${QQ_COMMAND_PANEL_ENABLED:true}
  # 入站按用户限流：一个用户一分钟内最多处理多少条；0 = 关闭。超限时只回一条礼貌提示，其余丢弃
  inbound-rate-limit-per-minute: ${QQ_INBOUND_RATE_LIMIT_PER_MINUTE:20}
  # 主动消息每天最多发多少条（0 = 不限，只记账并在面板显示）；超限后放弃发送并记 WARN
  proactive-daily-limit: ${QQ_PROACTIVE_DAILY_LIMIT:0}

exam:
  # 考研规划模块：计划/每日任务/打卡/进度统计 + 三条定时推送
  # 关掉推送（enabled=false）不影响聊天里的指令与工具，只是不再自动催
  enabled: ${EXAM_ENABLED:true}
  morning-time: ${EXAM_MORNING_TIME:07:30}
  evening-time: ${EXAM_EVENING_TIME:22:00}
  weekly-time: ${EXAM_WEEKLY_TIME:21:00}
  weekly-day: ${EXAM_WEEKLY_DAY:SUNDAY}
  # 昨天没做完的旧任务（7 天以内）自动顺延到今天
  carry-over: ${EXAM_CARRY_OVER:true}
  push-scan-interval-ms: ${EXAM_PUSH_SCAN_INTERVAL_MS:60000}
  push-initial-delay-ms: ${EXAM_PUSH_INITIAL_DELAY_MS:60000}

wechat:
  channel:
    mode: ${WECHAT_CHANNEL_MODE:disabled}   # QQ 项目默认不启动微信通道；本地调试可显式设 simulator

# 向量模型（记忆事实层的语义召回，2026-09-18）：OpenAI 兼容的 /embeddings，默认走阿里云百炼。
# 模型用 **qwen3.7-text-embedding-flash**（官方文档：支持 256/512/768/1024 维、默认 1024 维，
# 0.125 元/百万 token，比 text-embedding-v4 便宜 4 倍；128K 上下文）。**维度必须与表里的 vector(1024) 一致。**
# **api-key 留空时功能自动降级成「只新增不合并」**（事实照样入库，不召回、不判矛盾），不会报错。
# 服务器 .env 里填 EMBEDDING_API_KEY 即启用；凭据只在那份 600 的文件里。
embedding:
  base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  api-key: ${EMBEDDING_API_KEY:}
  model: ${EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
  dimensions: ${EMBEDDING_DIMENSIONS:1024}
  timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:20}
  connect-timeout-seconds: ${EMBEDDING_CONNECT_TIMEOUT_SECONDS:5}

memory:
  extraction-thread-pool-size: ${MEMORY_EXTRACTION_THREAD_POOL_SIZE:2}
  extraction-thread-name-prefix: ${MEMORY_EXTRACTION_THREAD_NAME_PREFIX:memory-extract-}
  context-rounds: ${MEMORY_CONTEXT_ROUNDS:10}
  context-ttl-hours: ${MEMORY_CONTEXT_TTL_HOURS:720}
  context-max-turns: ${MEMORY_CONTEXT_MAX_TURNS:40}
  context-max-chars: ${MEMORY_CONTEXT_MAX_CHARS:12000}
  core-max-load: ${MEMORY_CORE_MAX_LOAD:16}
  core-max-chars: ${MEMORY_CORE_MAX_CHARS:2200}
  work-max-load: ${MEMORY_WORK_MAX_LOAD:15}
  work-max-chars: ${MEMORY_WORK_MAX_CHARS:1500}
  # 记忆提取的触发节奏（**2026-09-18 换成轮次驱动**，见 MemoryExtractionScheduler 的类注释）：
  # 上一次提取之后机主又说了 rounds 条 → 跑；待提取窗口最老那条放了 max-idle-hours 小时 → 兜底跑。
  # 到点后再等 coalesce-seconds 合并同一串消息。旧参数 window/max-delay 已删除；
  # "用户说「记住」就立刻跑"这个特例按用户要求也删了（不要特例，只按轮次与时间）。
  # 轮次计数在 Redis（memory:pending:<user>），提取跑完**置 0**；键丢了会回退查库再种回去。
  extraction-rounds: ${MEMORY_EXTRACTION_ROUNDS:15}
  extraction-max-idle-hours: ${MEMORY_EXTRACTION_MAX_IDLE_HOURS:6}
  extraction-coalesce-seconds: ${MEMORY_EXTRACTION_COALESCE_SECONDS:10}
  # 上下文重叠：窗口里多出来的这 30%（K 条机主消息）只作背景（上次已处理），跨窗口的一句话才读得懂
  extraction-overlap-turns: ${MEMORY_EXTRACTION_OVERLAP_TURNS:5}
  # 最小间隔：同一个用户两次提取至少隔这么久（触发不会丢，只是往后挪）。
  extraction-min-interval-seconds: ${MEMORY_EXTRACTION_MIN_INTERVAL_SECONDS:180}
  # 2026-09-18：**前置过滤整块删除**（用户要求）——"这一轮全是问课表/设提醒就跳过"那套硬编码正则不再存在，
  # 该不该记全交给模型判断。WINDOW_EMPTY（没有可读轮次）仍会跳过，那是事实不是启发式。
  extraction-retry-attempts: ${MEMORY_EXTRACTION_RETRY_ATTEMPTS:2}
  extraction-retry-delay-seconds: ${MEMORY_EXTRACTION_RETRY_DELAY_SECONDS:15}
  # 2026-09-14 曾短暂上线过"每天一次记忆归纳（consolidation）"，实测不合格（模型把两条原文用「；」拼起来当归纳、
  # 思考吃满额度、replaces 对不上原文导致重复新增），**当天已整块删除**。始末与实测数据见 docs/memory-extraction.md。
  dedup-threshold: ${MEMORY_DEDUP_THRESHOLD:0.8}
  usage-touch-interval-minutes: ${MEMORY_USAGE_TOUCH_INTERVAL_MINUTES:15}
  extraction-max-candidates: ${MEMORY_EXTRACTION_MAX_CANDIDATES:32}
  extraction-max-content-chars: ${MEMORY_EXTRACTION_MAX_CONTENT_CHARS:4000}
  extraction-max-keywords: ${MEMORY_EXTRACTION_MAX_KEYWORDS:8}
  extraction-default-confidence: ${MEMORY_EXTRACTION_DEFAULT_CONFIDENCE:85}
  # 读不到库时（极少见）用它去 redis 兜底读窗口。**它不是"提取窗口"**——提取窗口见下面的 window-rows。
  extraction-recent-turns: ${MEMORY_EXTRACTION_RECENT_TURNS:40}
  # 提取窗口取多少行对话（user/assistant 混着算）。**默认 0 = 按 ROUNDS 自动推导**：
  #   窗口 = (ROUNDS + 重叠) × 2，重叠 = min(overlap-turns 上限, ⌈ROUNDS×0.3⌉)
  #   15 轮 → 重叠 5 → 40 行；30 轮 → 重叠仍 5（上限）→ 70 行。
  # 为什么不再写死 40：ROUNDS 一改，写死的窗口就跟不上，触发它的那几条里最老的会落在窗口外、静默漏记。
  # 想手工钉死就给个正数（会覆盖推导值）。
  extraction-window-rows: ${MEMORY_EXTRACTION_WINDOW_ROWS:0}
  # 事实层（v2，2026-09-18）：写新事实前先用**语义**召回这几条当前有效事实（不做字面匹配），
  # 交给模型三分类（无关/补充/矛盾）再决定新建还是改写；min-score 是余弦相似度下限，
  # 低于它的一律当"无关"直接新增（宁可多一条，也不要把无关的事错并到一起）。
  fact-recall-limit: ${MEMORY_FACT_RECALL_LIMIT:6}
  fact-recall-min-score: ${MEMORY_FACT_RECALL_MIN_SCORE:0.5}
  # 召回工具 recallMemoryFacts（**模型主动查**，不再每轮注入——2026-09-18 按用户要求改）：
  # 它问了就给宽一点，查一次只是一次向量检索的价钱；min-score 比写入时更低（宁可多给几条让它自己判断）
  fact-tool-recall-limit: ${MEMORY_FACT_TOOL_RECALL_LIMIT:8}
  fact-tool-min-score: ${MEMORY_FACT_TOOL_MIN_SCORE:0.3}
  # 已有事实卡片要不要直接塞进主提示词（2026-09-18）：塞了就**一次调用定稿**——模型在同一次输出里
  # 给出 relation（NEW/SUPERSEDES/SUPPLEMENT/SAME）和 targetSubject，省掉"每条事实再叫一次模型判关系"
  # （实测 4 条事实那次多花 0.0146 元 + 15 秒）。超过这个张数、或渲染超过下面那个字数，就不塞，
  # 写回时自动退回"向量召回 + 小判定"那条老路（硬塞必然截断，截断就可能漏掉该合并的那条）。
  fact-prompt-cards: ${MEMORY_FACT_PROMPT_CARDS:30}
  fact-prompt-cards-max-chars: ${MEMORY_FACT_PROMPT_CARDS_MAX_CHARS:4000}
  min-confidence: ${MEMORY_MIN_CONFIDENCE:60}
  default-work-priority: ${MEMORY_DEFAULT_WORK_PRIORITY:3}
  default-core-importance: ${MEMORY_DEFAULT_CORE_IMPORTANCE:5}
  default-work-importance: ${MEMORY_DEFAULT_WORK_IMPORTANCE:3}
  core-max-content-chars: ${MEMORY_CORE_MAX_CONTENT_CHARS_LIMIT:4000}
  work-max-content-chars: ${MEMORY_WORK_MAX_CONTENT_CHARS_LIMIT:2000}
  linked-media-max-per-memory: ${MEMORY_LINKED_MEDIA_MAX_PER_MEMORY:3}
  linked-media-summary-max-chars: ${MEMORY_LINKED_MEDIA_SUMMARY_MAX_CHARS:80}
  historical-item-max-chars: ${MEMORY_HISTORICAL_ITEM_MAX_CHARS:1200}
  # 自主模块（「它自己那一侧」）：总开关 + 预算 + 归属人。
  # 归属人留空时模块**整体不工作**（fail-closed：别人的对话不会污染它，它也不会把机主的事带到别人那里）。
  self-enabled: ${MEMORY_SELF_ENABLED:true}
  self-owner-openid: ${MEMORY_SELF_OWNER_OPENID:}
  self-max-chars: ${MEMORY_SELF_MAX_CHARS:800}
  self-block-char-limit: ${MEMORY_SELF_BLOCK_CHAR_LIMIT:1200}
  self-max-commitments: ${MEMORY_SELF_MAX_COMMITMENTS:20}
  self-max-commitments-in-prompt: ${MEMORY_SELF_MAX_COMMITMENTS_IN_PROMPT:5}
  # 二期：反思（触发不是"每晚一次"；step-count = 攒够多少轮机主消息才跑一次）
  self-reflect-mode: ${MEMORY_SELF_REFLECT_MODE:step-count}
  self-reflect-turns: ${MEMORY_SELF_REFLECT_TURNS:12}
  self-reflect-check-cron: ${MEMORY_SELF_REFLECT_CHECK_CRON:0 */10 * * * *}
  self-reflect-daily-call-limit: ${MEMORY_SELF_REFLECT_DAILY_CALL_LIMIT:4}
  self-reflect-min-importance: ${MEMORY_SELF_REFLECT_MIN_IMPORTANCE:2}
  self-reflect-max-input-events: ${MEMORY_SELF_REFLECT_MAX_INPUT_EVENTS:40}
  self-reflect-max-prompt-chars: ${MEMORY_SELF_REFLECT_MAX_PROMPT_CHARS:6000}
  # 防抖：定时任务与手动触发可能前后脚到，别对同一批内容重复花调用（spec §13.2 要求的"最小反思间隔"）
  self-reflect-min-interval-minutes: ${MEMORY_SELF_REFLECT_MIN_INTERVAL_MINUTES:30}
  # 二期：判断→倾向（全部是规则；这些是"留空参数"，数据够了再调）
  self-stance-min-evidence: ${MEMORY_SELF_STANCE_MIN_EVIDENCE:3}
  self-stance-min-days: ${MEMORY_SELF_STANCE_MIN_DAYS:2}
  self-stance-min-contexts: ${MEMORY_SELF_STANCE_MIN_CONTEXTS:2}
  self-stance-threshold: ${MEMORY_SELF_STANCE_THRESHOLD:1.2}
  self-stance-max-active: ${MEMORY_SELF_STANCE_MAX_ACTIVE:5}
  self-stance-half-life-days: ${MEMORY_SELF_STANCE_HALF_LIFE_DAYS:30}
  self-stance-stale-days: ${MEMORY_SELF_STANCE_STALE_DAYS:60}
  self-max-stances-in-prompt: ${MEMORY_SELF_MAX_STANCES_IN_PROMPT:5}
  # 复查时机：FSRS v6 的幂律遗忘曲线（decay 默认 -0.1542），由 R(t,S) 掉到目标保留率反推
  self-fsrs-decay: ${MEMORY_SELF_FSRS_DECAY:-0.1542}
  self-review-target: ${MEMORY_SELF_REVIEW_TARGET:0.8}
  # 三期领域①：教训清单（它自己的可靠性）——复现率是标尺，所以上限与合并阈值都很关键
  self-max-lessons: ${MEMORY_SELF_MAX_LESSONS:30}
  self-lesson-merge-similarity: ${MEMORY_SELF_LESSON_MERGE_SIMILARITY:0.72}
  self-lesson-clean-reviews-to-close: ${MEMORY_SELF_LESSON_CLEAN_REVIEWS_TO_CLOSE:3}
  self-max-lessons-in-prompt: ${MEMORY_SELF_MAX_LESSONS_IN_PROMPT:3}
  # 三期领域②：「它自己的时间」——**不看钟点**（2026-09-15 用户定："什么时候想说就什么时候说"）。
  # 这个心跳每 10 分钟看一眼"它现在想不想动"（手上有事在推进 / 搁太久还有没结的事），条件够了才叫它。
  # **预算按钱算**（同日用户定）：日 0.5 元、单次先给 60%、**没落产出才续一次**、当天封顶 ×1.5。
  # 按钱不按轮数：每轮 prompt 大小差一倍，轮数不是钱的代理。花超了面板上看得见。
  self-quest-mode: ${MEMORY_SELF_QUEST_MODE:daily}
  self-quest-check-cron: ${MEMORY_SELF_QUEST_CHECK_CRON:0 */10 * * * *}
  self-quest-daily-budget-yuan: ${MEMORY_SELF_QUEST_DAILY_BUDGET_YUAN:0.5}
  self-quest-budget-overrun-factor: ${MEMORY_SELF_QUEST_BUDGET_OVERRUN_FACTOR:1.5}
  self-quest-single-budget-ratio: ${MEMORY_SELF_QUEST_SINGLE_BUDGET_RATIO:0.6}
  self-quest-max-rounds: ${MEMORY_SELF_QUEST_MAX_ROUNDS:12}
  self-quest-min-interval-minutes: ${MEMORY_SELF_QUEST_MIN_INTERVAL_MINUTES:120}
  # 触发条件：自上次作业以来它自己事件的兴趣累积过阈值 / 闲置这么久且手上还有没结的事
  self-quest-interest-threshold: ${MEMORY_SELF_QUEST_INTEREST_THRESHOLD:8}
  self-quest-idle-hours: ${MEMORY_SELF_QUEST_IDLE_HOURS:10}
  # 它的「嘴」：想说的话**当场就发**（作业跑完立刻发，没跑作业时下一次心跳发），
  # 一天最多 N 条，**发出去才算**；拦住的不丢，标 SUPPRESSED 留在库里让面板看得见。
  self-speak-enabled: ${MEMORY_SELF_SPEAK_ENABLED:true}
  self-speak-daily-limit: ${MEMORY_SELF_SPEAK_DAILY_LIMIT:1}
  # 同时开着的方向数（§9 说 1–2 个：稀缺才有取舍）
  self-max-active-quests: ${MEMORY_SELF_MAX_ACTIVE_QUESTS:2}
  # "不等机主说话也会想"：它自己事件的兴趣累积过阈值就触发反思（Generative Agents 的判据）+ 闲置超时。
  # mode=off 是总闸，关掉之后这三条都不自动跑。
  self-reflect-on-interest: ${MEMORY_SELF_REFLECT_ON_INTEREST:true}
  self-reflect-interest-threshold: ${MEMORY_SELF_REFLECT_INTEREST_THRESHOLD:150}
  self-reflect-on-idle: ${MEMORY_SELF_REFLECT_ON_IDLE:true}
  self-reflect-idle-hours: ${MEMORY_SELF_REFLECT_IDLE_HOURS:20}
  # 可按部署语言扩展“追溯历史”触发词和检索降噪词；留空时使用内置通用中文默认值。
  history-markers: ${MEMORY_HISTORY_MARKERS:之前,上次,以前,曾经,历史,记得,聊过,说过,那时候,过去,还记得}
  conversation-retrieval-noise: ${MEMORY_CONVERSATION_RETRIEVAL_NOISE:之前,上次,以前,曾经,历史,记得,聊过,说过,那时候,过去,还记得,用户,助手,帮我,请问,这个,那个,什么,怎么,一下,看看}
  negation-markers: ${MEMORY_NEGATION_MARKERS:不再,不想,不会,取消,放弃,停止,改考,不喜欢,不需要}
  historical-retrieval-limit: ${MEMORY_HISTORICAL_RETRIEVAL_LIMIT:8}
  historical-min-score: ${MEMORY_HISTORICAL_MIN_SCORE:3}
  conversation-extraction-limit: ${MEMORY_CONVERSATION_EXTRACTION_LIMIT:80}
  conversation-retrieval-limit: ${MEMORY_CONVERSATION_RETRIEVAL_LIMIT:2000}
  conversation-search-per-term: ${MEMORY_CONVERSATION_SEARCH_PER_TERM:16}
  conversation-max-retrieval-terms: ${MEMORY_CONVERSATION_MAX_RETRIEVAL_TERMS:8}
  conversation-forget-scan-batch: ${MEMORY_CONVERSATION_FORGET_SCAN_BATCH:250}
  conversation-retention-days: ${MEMORY_CONVERSATION_RETENTION_DAYS:3650}
  conversation-max-content-chars: ${MEMORY_CONVERSATION_MAX_CONTENT_CHARS:12000}
  lifecycle-scan-interval-ms: ${MEMORY_LIFECYCLE_SCAN_INTERVAL_MS:3600000}
  lifecycle-initial-delay-ms: ${MEMORY_LIFECYCLE_INITIAL_DELAY_MS:60000}

reminder:
  default-prewarm-minutes: ${REMINDER_DEFAULT_PREWARM_MINUTES:10}
  max-recent-status-results: ${REMINDER_MAX_RECENT_STATUS_RESULTS:12}
  misfire-grace-seconds: ${REMINDER_MISFIRE_GRACE_SECONDS:60}
  recovery-scan-interval-ms: ${REMINDER_RECOVERY_SCAN_INTERVAL_MS:300000}
  recovery-initial-delay-ms: ${REMINDER_RECOVERY_INITIAL_DELAY_MS:120000}

care:
  scan-interval-ms: ${CARE_SCAN_INTERVAL_MS:60000}
  initial-delay-ms: ${CARE_INITIAL_DELAY_MS:30000}
  delivery-time: ${CARE_DELIVERY_TIME:20:30}
  focus-max-chars: ${CARE_FOCUS_MAX_CHARS:100}
  min-focus-priority: ${CARE_MIN_FOCUS_PRIORITY:4}
  weekly-day: ${CARE_WEEKLY_DAY:SUNDAY}
  retry-delay-minutes: ${CARE_RETRY_DELAY_MINUTES:60}

backup:
  dir: ${BACKUP_DIR:backup}
  cron: '${BACKUP_CRON:0 0 3 * * ?}'
  retention-days: ${BACKUP_RETENTION_DAYS:30}
  conversation-limit: ${BACKUP_CONVERSATION_LIMIT:10000}
  change-log-limit: ${BACKUP_CHANGE_LOG_LIMIT:5000}

# 定时任务：到点让机器人真的去做一件事并把结果发回来（区别于 reminder 的"到点发一句话"）
# 调度复用 Quartz（组 scheduled-tasks），任务定义存 scheduled_task 表
scheduled:
  enabled: ${SCHEDULED_ENABLED:true}
  max-per-user: ${SCHEDULED_MAX_PER_USER:10}
  result-max-chars: ${SCHEDULED_RESULT_MAX_CHARS:2000}

# 墨墨背单词开放 API（个人 Token 在墨墨 App「开放 API」里生成，有效期很短；
# 面板「背单词」页保存的 Token 会写进数据库并优先于这里的 MAIMEMO_API_TOKEN）
maimemo:
  enabled: ${MAIMEMO_ENABLED:true}
  api-token: ${MAIMEMO_API_TOKEN:}
  # 墨墨是单账号接口：只有这个用户（openid）能查它的数据；留空时回落到 alert.qq-openid
  owner-user-id: ${MAIMEMO_OWNER_USER_ID:}
  base-url: ${MAIMEMO_BASE_URL:https://open.maimemo.com/open/api/v1}
  timeout-seconds: ${MAIMEMO_TIMEOUT_SECONDS:10}
  connect-timeout-seconds: ${MAIMEMO_CONNECT_TIMEOUT_SECONDS:5}
  cache-seconds: ${MAIMEMO_CACHE_SECONDS:30}
  item-limit: ${MAIMEMO_ITEM_LIMIT:30}
  # 顽固单词要在完整学习记录里筛（实测 833 条里才有 35 个 STICKING），所以单独拉一次大列表并单独缓存
  record-fetch-limit: ${MAIMEMO_RECORD_FETCH_LIMIT:1000}
  sticking-cache-seconds: ${MAIMEMO_STICKING_CACHE_SECONDS:600}
  daily-push-enabled: ${MAIMEMO_DAILY_PUSH_ENABLED:true}
  daily-push-time: ${MAIMEMO_DAILY_PUSH_TIME:21:30}
  push-scan-interval-ms: ${MAIMEMO_PUSH_SCAN_INTERVAL_MS:60000}
  push-initial-delay-ms: ${MAIMEMO_PUSH_INITIAL_DELAY_MS:60000}
  # OIDC 长期授权（在 open.maimemo.com/app 创建"后端应用"后填这里；回调地址必须与平台登记的一致）
  oidc:
    client-id: ${MAIMEMO_OIDC_CLIENT_ID:}
    client-secret: ${MAIMEMO_OIDC_CLIENT_SECRET:}
    redirect-uri: ${MAIMEMO_OIDC_REDIRECT_URI:}
    scopes: ${MAIMEMO_OIDC_SCOPES:openid offline_access open.memo.study}
    authorization-endpoint: ${MAIMEMO_OIDC_AUTHORIZATION_ENDPOINT:https://accounts.maimemo.com/oidc/auth}
    token-endpoint: ${MAIMEMO_OIDC_TOKEN_ENDPOINT:https://accounts.maimemo.com/oidc/token}

logging:
  file:
    path: logs
  level:
    root: INFO
    com.liche.wechatagent: INFO
    org.quartz: WARN

conversation:
  trace:
    enabled: ${CONVERSATION_TRACE_ENABLED:false}
    max-chars: ${CONVERSATION_TRACE_MAX_CHARS:8000}

alert:
  # 运维告警推送：只发给下方 openid 指定的用户（默认关闭）
  enabled: ${ALERT_ENABLED:false}
  qq-openid: ${ALERT_QQ_OPENID:}
  repeat-minutes: ${ALERT_REPEAT_MINUTES:30}
  check-interval-ms: ${ALERT_CHECK_INTERVAL_MS:60000}
  disk-free-min-bytes: ${ALERT_DISK_FREE_MIN_BYTES:2147483648}
  heap-used-max-percent: ${ALERT_HEAP_USED_MAX_PERCENT:85}
  startup-grace-seconds: ${ALERT_STARTUP_GRACE_SECONDS:120}
  # 记忆提取的两条告警（2026-09-18 加）：提取跑在后台，出问题时用户完全感觉不到，所以让它主动报
  # 连续失败几次告警（0=不检查）；单次失败会自己重试，连续两次才是真问题（多半是思考吃满额度导致解析失败）
  memory-failure-streak: ${ALERT_MEMORY_FAILURE_STREAK:2}
  # 当天提取花费超过多少元告警（0=不检查）；正常量级 0.3~0.4 元/天
  memory-daily-cost-yuan: ${ALERT_MEMORY_DAILY_COST_YUAN:2.0}

management:
  access:
    # 本机模式可只允许回环地址；production 强制要求设置 ADMIN_API_KEY。
    admin-api-key: ${ADMIN_API_KEY:}
    admin-username: ${ADMIN_USERNAME:admin}
    require-key: ${ADMIN_REQUIRE_KEY:false}
    allow-loopback-without-key: ${ADMIN_ALLOW_LOOPBACK_WITHOUT_KEY:true}
    allowed-ips: ${ADMIN_ALLOWED_IPS:127.0.0.1,::1}
  dashboard:
    metrics-sample-ms: ${ADMIN_METRICS_SAMPLE_MS:10000}
