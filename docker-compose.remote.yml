services:
  agent:
    image: ${AGENT_IMAGE:-wechat-agent:latest}
    container_name: wechat-agent-java
    restart: unless-stopped
    # 与 MySQL/Redis/SearXNG 共用宿主网络：容器内 127.0.0.1 即服务器本机。
    # 面板由应用**自带 HTTPS**（原 nginx 网关已移除），对外监听标准端口 443，
    # 因此访问地址不带端口：https://liche.cloud/
    network_mode: host
    # 日志上限：json-file 默认不轮转，容器 stdout 会无限增长（应用日志同时写控制台）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      SERVER_ADDRESS: ${SERVER_ADDRESS:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-443}
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /app/certs/server.crt
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: /app/certs/server.key
      # 默认 production：这个 profile 是 ddl-auto=validate，不会再让 Hibernate 自动改生产表。
      # 原来默认 local（ddl-auto=update）——只要服务器 .env 忘了写这一行，实体一改就会静默动生产库结构。
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      # JVM 默认时区必须是本地时区：Quartz 的 Cron 表达式与 Spring @Scheduled(cron) 都按 JVM 默认时区解析，
      # 容器默认是 UTC，会让「每天 8 点」实际在本地 16 点跑。
      TZ: Asia/Shanghai
      # 通道模式：disabled（只跑 QQ）/ simulator（本地或排障用的假通道，可调 /api/sim/*）。
      # 注意 compose 只传 environment 里列出的变量——以前没有这一行，改服务器 .env 根本进不了容器。
      WECHAT_CHANNEL_MODE: ${WECHAT_CHANNEL_MODE:-disabled}
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-wechat_agent}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SEARXNG_BASE_URL: http://127.0.0.1:8888
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
      QQ_ENABLED: ${QQ_ENABLED:-false}
      # 必须透传：compose 只传列出的变量，以前没这一行，服务器 .env 写 QQ_SANDBOX=false 也不生效，
      # 容器里一直按 application.yml 的默认值连**沙箱**网关（日志里是 wss://sandbox.api.sgroup.qq.com）。
      # 默认值保持 true＝维持现状；机器人正式发布后再在服务器 .env 显式改成 false。
      QQ_SANDBOX: ${QQ_SANDBOX:-true}
      QQ_APP_ID: ${QQ_APP_ID:-}
      QQ_CLIENT_SECRET: ${QQ_CLIENT_SECRET:-}
      ADMIN_REQUIRE_KEY: ${ADMIN_REQUIRE_KEY:-false}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_ALLOW_LOOPBACK_WITHOUT_KEY: ${ADMIN_ALLOW_LOOPBACK_WITHOUT_KEY:-true}
      # 运维告警：只推给 ALERT_QQ_OPENID 指定的用户
      ALERT_ENABLED: ${ALERT_ENABLED:-false}
      ALERT_QQ_OPENID: ${ALERT_QQ_OPENID:-}
      ALERT_REPEAT_MINUTES: ${ALERT_REPEAT_MINUTES:-30}
      # ICP 备案号（备案通过后填这里，页面底部会显示并链接工信部；留空则完全不显示）
      SITE_ICP: ${SITE_ICP:-}
      # 定时任务（到点执行并把结果发回）
      SCHEDULED_ENABLED: ${SCHEDULED_ENABLED:-true}
      SCHEDULED_MAX_PER_USER: ${SCHEDULED_MAX_PER_USER:-10}
      SCHEDULED_RESULT_MAX_CHARS: ${SCHEDULED_RESULT_MAX_CHARS:-2000}
      # 墨墨背单词开放 API；Token 也可在面板「背单词」页保存（面板里的值优先）
      MAIMEMO_ENABLED: ${MAIMEMO_ENABLED:-true}
      MAIMEMO_API_TOKEN: ${MAIMEMO_API_TOKEN:-}
      MAIMEMO_OWNER_USER_ID: ${MAIMEMO_OWNER_USER_ID:-}
      MAIMEMO_DAILY_PUSH_ENABLED: ${MAIMEMO_DAILY_PUSH_ENABLED:-true}
      MAIMEMO_DAILY_PUSH_TIME: ${MAIMEMO_DAILY_PUSH_TIME:-21:30}
      MAIMEMO_TIMEOUT_SECONDS: ${MAIMEMO_TIMEOUT_SECONDS:-10}
      MAIMEMO_CACHE_SECONDS: ${MAIMEMO_CACHE_SECONDS:-30}
      # OIDC 长期授权（创建"后端应用"后填这三项；回调地址要与平台登记一致）
      MAIMEMO_OIDC_CLIENT_ID: ${MAIMEMO_OIDC_CLIENT_ID:-}
      MAIMEMO_OIDC_CLIENT_SECRET: ${MAIMEMO_OIDC_CLIENT_SECRET:-}
      MAIMEMO_OIDC_REDIRECT_URI: ${MAIMEMO_OIDC_REDIRECT_URI:-}
      # 数据库备份：默认每天 03:00。**要验证备份真的能跑，就得能改这个 cron**——
      # 不透传的话改 .env 不生效（同第 36 条坑），只能等到凌晨三点才知道有没有坏。
      BACKUP_CRON: ${BACKUP_CRON:-0 0 3 * * ?}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      # 自签证书由服务器侧生成、不入库（/opt/wechat-agent-infra/docker/tls/）
      - ./docker/tls:/app/certs:ro
      # 这三个原来都在容器的可写层里：CI 每次部署都会换 tag 重建容器，于是**备份文件、
      # 用户长期保存的媒体、容器内日志全部随容器消失**，而面板还显示"数据库备份在跑"——
      # 唯一的离卷备份活不过一次部署。挂到宿主机（目录权限 700）。
      - ./backup:/app/backup
      - ./stored-media:/app/stored-media
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      searxng:
        condition: service_started

  mysql:
    image: mysql:8.0.46
    container_name: wechat-agent-mysql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-wechat_agent}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+08:00"]
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wechat-agent-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    command: redis-server --appendonly yes

  searxng:
    image: searxng/searxng:latest
    container_name: wechat-agent-searxng
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      SEARXNG_BASE_URL: http://localhost:8888
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:8888:8080"]
    volumes:
      - searxng-data:/etc/searxng
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  mysql-data:
  redis-data:
  searxng-data:
