services:
  agent:
    image: ${AGENT_IMAGE:-wechat-agent:latest}
    container_name: wechat-agent-java
    restart: unless-stopped
    # 与 MySQL/Redis/SearXNG 共用宿主网络：容器内 127.0.0.1 即服务器本机。
    # 面板由应用**自带 HTTPS**（原 nginx 网关已移除），对外监听标准端口 443，
    # 因此访问地址不带端口：https://liche.cloud/
    network_mode: host
    # 容器加固（见 AGENTS 坑 53）：丢掉所有 capability，只把"绑定 1024 以下端口"这一个加回来（443 需要）。
    # no-new-privileges 防止容器内进程通过 setuid 提权。**没有**开 read_only：应用要写 /app/{logs,backup,stored-media}
    # 三个挂载目录和 /tmp，read_only 需要额外配 tmpfs 并逐个验证，留作下一步。
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    # 日志上限：json-file 默认不轮转，容器 stdout 会无限增长（应用日志同时写控制台）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      SERVER_ADDRESS: ${SERVER_ADDRESS:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-443}
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /app/certs/server.crt
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: /app/certs/server.key
      # 默认 production：这个 profile 是 ddl-auto=validate，不会再让 Hibernate 自动改生产表。
      # 原来默认 local（ddl-auto=update）——只要服务器 .env 忘了写这一行，实体一改就会静默动生产库结构。
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      # JVM 默认时区必须是本地时区：Quartz 的 Cron 表达式与 Spring @Scheduled(cron) 都按 JVM 默认时区解析，
      # 容器默认是 UTC，会让「每天 8 点」实际在本地 16 点跑。
      TZ: Asia/Shanghai
      # 通道模式：disabled（只跑 QQ）/ simulator（本地或排障用的假通道，可调 /api/sim/*）。
      # 注意 compose 只传 environment 里列出的变量——以前没有这一行，改服务器 .env 根本进不了容器。
      WECHAT_CHANNEL_MODE: ${WECHAT_CHANNEL_MODE:-disabled}
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-wechat_agent}
      # 应用**不再用 root**：独立账号只授 wechat_agent.*（见 AGENTS 坑 53）。
      # 注意 MYSQL_PASSWORD 这个变量以前同时是"应用的密码"和"mysql 服务的 root 密码"，改一个会影响另一个
      # （健康检查会用新口令去 ping 而库里还是旧的 → 部署直接起不来）。现在两者彻底分开。
      MYSQL_USER: ${MYSQL_APP_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-root}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SEARXNG_BASE_URL: http://127.0.0.1:8888
      # 媒体上下文：以前一个都没透传，服务器 .env 改了不生效（坑 36 同类）
      MEDIA_CONTEXT_MAX_FILES_PER_TASK: ${MEDIA_CONTEXT_MAX_FILES_PER_TASK:-10}
      MEDIA_CONTEXT_PENDING_TTL_MINUTES: ${MEDIA_CONTEXT_PENDING_TTL_MINUTES:-30}
      MEDIA_CONTEXT_MAX_PENDING_PER_CONVERSATION: ${MEDIA_CONTEXT_MAX_PENDING_PER_CONVERSATION:-8}
      MEDIA_CONTEXT_EXCERPT_MAX_CHARS: ${MEDIA_CONTEXT_EXCERPT_MAX_CHARS:-4000}
      MEDIA_STORAGE_MAX_FILE_BYTES: ${MEDIA_STORAGE_MAX_FILE_BYTES:-20971520}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # 漏一个就"改了 .env 不生效且不报错"（坑 36）：温度/超时以前根本没透传，改了也没用
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-5}
      # 深度思考档位：留空表示用 application.yml 的内置默认值（关思考的是 extract/reminder_parse/
      # schedule_parse/archive；请求体字段形状也由这里覆盖，上游换写法不用改代码）
      LLM_THINKING_DISABLED_SCENARIOS: ${LLM_THINKING_DISABLED_SCENARIOS:-extract,schedule_parse,dialog_fast}
      LLM_THINKING_ENABLED_SCENARIOS: ${LLM_THINKING_ENABLED_SCENARIOS:-}
      LLM_THINKING_DISABLED_BODY: ${LLM_THINKING_DISABLED_BODY:-}
      LLM_THINKING_ENABLED_BODY: ${LLM_THINKING_ENABLED_BODY:-}
      LLM_ZERO_TEMPERATURE_SCENARIOS: ${LLM_ZERO_TEMPERATURE_SCENARIOS:-extract,reminder_parse,schedule_parse,archive}
      # max_tokens 上限：0 = 不设；思考 token 也算进上限，对话默认不设
      LLM_MAX_TOKENS_STRUCTURED: ${LLM_MAX_TOKENS_STRUCTURED:-4096}
      LLM_MAX_TOKENS_DIALOG: ${LLM_MAX_TOKENS_DIALOG:-0}
      LLM_MAX_TOKENS_DIALOG_DEEP: ${LLM_MAX_TOKENS_DIALOG_DEEP:-0}
      # thinkDeeper（模型自己申请升档）的预算与额度
      AGENT_DEEP_TOOL_ROUNDS: ${AGENT_DEEP_TOOL_ROUNDS:-16}
      AGENT_DEEP_STREAM_TIMEOUT_SECONDS: ${AGENT_DEEP_STREAM_TIMEOUT_SECONDS:-240}
      THINKING_DAILY_LIMIT_PER_USER: ${THINKING_DAILY_LIMIT_PER_USER:-5}
      # 对话省电档与工具集裁剪（都可一键关掉）
      LLM_DIALOG_FAST_ENABLED: ${LLM_DIALOG_FAST_ENABLED:-true}
      AGENT_TOOL_TRIM_ENABLED: ${AGENT_TOOL_TRIM_ENABLED:-true}
      AGENT_TOOL_TRIM_HISTORY_TURNS: ${AGENT_TOOL_TRIM_HISTORY_TURNS:-4}
      # 升档后要不要先发一句"稍等，我仔细想想"（否则用户会盯着 10~30 秒没有任何反馈）
      AGENT_DEEP_NOTICE_ENABLED: ${AGENT_DEEP_NOTICE_ENABLED:-true}
      QQ_ENABLED: ${QQ_ENABLED:-false}
      # 必须透传：compose 只传列出的变量，以前没这一行，服务器 .env 写 QQ_SANDBOX=false 也不生效，
      # 容器里一直按 application.yml 的默认值连**沙箱**网关（日志里是 wss://sandbox.api.sgroup.qq.com）。
      # 默认值保持 true＝维持现状；机器人正式发布后再在服务器 .env 显式改成 false。
      QQ_SANDBOX: ${QQ_SANDBOX:-true}
      QQ_APP_ID: ${QQ_APP_ID:-}
      QQ_CLIENT_SECRET: ${QQ_CLIENT_SECRET:-}
      # 通道健壮性（compose 只传列出的变量，不加这两行改 .env 不生效——见坑 36）
      # 入站按用户限流：每分钟超过这个条数就只回一条提示、其余丢弃（0 = 关闭）
      QQ_INBOUND_RATE_LIMIT_PER_MINUTE: ${QQ_INBOUND_RATE_LIMIT_PER_MINUTE:-20}
      # 主动消息每天上限（0 = 不限，只记账；面板「QQ 通道」页能看到当天发了多少条）
      QQ_PROACTIVE_DAILY_LIMIT: ${QQ_PROACTIVE_DAILY_LIMIT:-0}
      # QQ REST 超时：平时不用改，但**验证"超时不再重复发消息"必须能改**（同坑 36/46：
      # 不透传就没法在不改代码、不重新构建的前提下造出"结果未知"的发送失败）
      QQ_API_CONNECT_TIMEOUT_SECONDS: ${QQ_API_CONNECT_TIMEOUT_SECONDS:-5}
      QQ_API_READ_TIMEOUT_SECONDS: ${QQ_API_READ_TIMEOUT_SECONDS:-15}
      ADMIN_REQUIRE_KEY: ${ADMIN_REQUIRE_KEY:-false}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_ALLOW_LOOPBACK_WITHOUT_KEY: ${ADMIN_ALLOW_LOOPBACK_WITHOUT_KEY:-true}
      # 运维告警：只推给 ALERT_QQ_OPENID 指定的用户
      ALERT_ENABLED: ${ALERT_ENABLED:-false}
      ALERT_QQ_OPENID: ${ALERT_QQ_OPENID:-}
      ALERT_REPEAT_MINUTES: ${ALERT_REPEAT_MINUTES:-30}
      # ICP 备案号（备案通过后填这里，页面底部会显示并链接工信部；留空则完全不显示）
      SITE_ICP: ${SITE_ICP:-}
      # 定时任务（到点执行并把结果发回）
      SCHEDULED_ENABLED: ${SCHEDULED_ENABLED:-true}
      SCHEDULED_MAX_PER_USER: ${SCHEDULED_MAX_PER_USER:-10}
      SCHEDULED_RESULT_MAX_CHARS: ${SCHEDULED_RESULT_MAX_CHARS:-2000}
      # 墨墨背单词开放 API；Token 也可在面板「背单词」页保存（面板里的值优先）
      MAIMEMO_ENABLED: ${MAIMEMO_ENABLED:-true}
      MAIMEMO_API_TOKEN: ${MAIMEMO_API_TOKEN:-}
      MAIMEMO_OWNER_USER_ID: ${MAIMEMO_OWNER_USER_ID:-}
      MAIMEMO_DAILY_PUSH_ENABLED: ${MAIMEMO_DAILY_PUSH_ENABLED:-true}
      MAIMEMO_DAILY_PUSH_TIME: ${MAIMEMO_DAILY_PUSH_TIME:-21:30}
      MAIMEMO_TIMEOUT_SECONDS: ${MAIMEMO_TIMEOUT_SECONDS:-10}
      MAIMEMO_CACHE_SECONDS: ${MAIMEMO_CACHE_SECONDS:-30}
      # OIDC 长期授权（创建"后端应用"后填这三项；回调地址要与平台登记一致）
      MAIMEMO_OIDC_CLIENT_ID: ${MAIMEMO_OIDC_CLIENT_ID:-}
      MAIMEMO_OIDC_CLIENT_SECRET: ${MAIMEMO_OIDC_CLIENT_SECRET:-}
      MAIMEMO_OIDC_REDIRECT_URI: ${MAIMEMO_OIDC_REDIRECT_URI:-}
      # 考研规划模块：三条定时推送的时间与总开关（compose 只传列出的变量——见坑 36）
      EXAM_ENABLED: ${EXAM_ENABLED:-true}
      EXAM_MORNING_TIME: ${EXAM_MORNING_TIME:-07:30}
      EXAM_EVENING_TIME: ${EXAM_EVENING_TIME:-22:00}
      EXAM_WEEKLY_TIME: ${EXAM_WEEKLY_TIME:-21:00}
      EXAM_WEEKLY_DAY: ${EXAM_WEEKLY_DAY:-SUNDAY}
      EXAM_CARRY_OVER: ${EXAM_CARRY_OVER:-true}
      # 数据库备份：默认每天 03:00。**要验证备份真的能跑，就得能改这个 cron**——
      # 不透传的话改 .env 不生效（同第 36 条坑），只能等到凌晨三点才知道有没有坏。
      BACKUP_CRON: ${BACKUP_CRON:-0 0 3 * * ?}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      # 自签证书由服务器侧生成、不入库（/opt/wechat-agent-infra/docker/tls/）
      - ./docker/tls:/app/certs:ro
      # 这三个原来都在容器的可写层里：CI 每次部署都会换 tag 重建容器，于是**备份文件、
      # 用户长期保存的媒体、容器内日志全部随容器消失**，而面板还显示"数据库备份在跑"——
      # 唯一的离卷备份活不过一次部署。挂到宿主机（目录权限 700）。
      - ./backup:/app/backup
      - ./stored-media:/app/stored-media
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      searxng:
        condition: service_started

  mysql:
    # 数据卷由 8.0.46 创建，**换 8.0.27 会导致 InnoDB 起不来**（AGENTS 第 5 节第 1 条）。
    # 再钉死 digest，避免同 tag 被上游重推时悄悄换了内容。
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: wechat-agent-mysql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-wechat_agent}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+08:00"]
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # 钉 digest（这一层实测跑的是 Redis 7.4.11）；`redis:7-alpine` 这种浮动 minor 会跟着上游走
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: wechat-agent-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    # 有口令才加 --requirepass（空值时不加，避免把空口令当成"无密码"又当成"有密码"的歧义）
    command: ["sh", "-c", "exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]

  searxng:
    # 钉 digest 而不是 :latest —— 线上版本必须可复现，不能让上游的一次回归在下次重建时静默生效。
    # 换版本的正确做法：`docker pull searxng/searxng:latest` 后
    # `docker image inspect searxng/searxng:latest -f '{{index .RepoDigests 0}}'` 取新 digest 再改这里。
    # 注意 compose 文件由 CI 每次 scp 覆盖，所以**只能改仓库里的这份**，改服务器上的会被冲掉。
    image: searxng/searxng@sha256:6c9da4d4d236672a1b722f597d643de2202410a2281b7aa4d98fccca3a8f3732
    container_name: wechat-agent-searxng
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      SEARXNG_BASE_URL: http://localhost:8888
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:8888:8080"]
    volumes:
      - searxng-data:/etc/searxng
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  mysql-data:
  redis-data:
  searxng-data:
