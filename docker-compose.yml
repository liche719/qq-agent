# 本地开发基础设施：MySQL 8 + Redis 7 + SearX-NG（如你已有 SearX-NG 容器可删除该服务）
# 使用：启动 Docker Desktop 后，在本目录执行  docker compose up -d
services:
  mysql:
    image: mysql:8.0.46
    container_name: wechat-agent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wechat_agent
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wechat-agent-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  searxng:
    image: searxng/searxng:latest
    container_name: wechat-agent-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://localhost:8888
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - searxng-data:/etc/searxng
      # 使用项目内针对国内网络调优的配置（启用 json 格式、关闭限流、只保留可达引擎）
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  mysql-data:
  redis-data:
  searxng-data:
